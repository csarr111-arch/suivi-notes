const done=n=>!!n&&F.every(f=>nm(n[f[0]]));

const rate=L=>{const d=L.filter(x=>done(x.n));return d.length?d.filter(x=>sc20(x.n)>5).length*100/d.length:null};
const sp=(s,g)=>rate(s.st.filter(x=>!g||x.sexe==g)),good=(s,g)=>{const p=sp(s,g);return p!=null&&p>50};
const grp=(L,g)=>{if(!L.some(s=>s.st.some(x=>done(x.n)&&(!g||x.sexe==g))))return null;const Z=g?L.filter(s=>s.st.some(x=>x.sexe==g)):L;return Z.filter(s=>good(s,g)).length*100/Z.length};

$("#vw").innerHTML=`<div class="tbr"><div class="seg">${[["all","Toutes"],["ko","Urgentes"],["wr","À suivre"]].map(x=>`<button class="${FL.al==x[0]?"on":""}" onclick="FL.al='${x[0]}';V.al()">${x[1]}</button>`).join("")}</div><span class="mu">${A.length} école(s) · ${ml(MO)}</span></div><div class="card">${A.map(alRow).join("")||empty("Aucune alerte","Toutes les écoles sont à jour pour ce mois.","","check")}</div>`};
V.cons=async()=>{await loadRes();const L=[...SCH].sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));
$("#vw").innerHTML=`<div class="tbr"><div class="sb">${ic("search")}<input placeholder="Filtrer les écoles" value="${esc(FL.cq)}" oninput="FL.cq=this.value;consSel()"></div><select id="cs" onchange="FL.cs=this.value;consT()" style="min-width:240px"></select><button class="btn" onclick="expCons()">${ic("down")} Exporter</button></div><div id="ctb"></div>`;consSel()};
function consSel(){const q=FL.cq.toLowerCase(),L=SCH.filter(s=>!q||(s.nom+" "+s.directeur).toLowerCase().includes(q)).sort((a,b)=>a.nom.localeCompare(b.nom,"fr"));if(!L.some(s=>s.id==FL.cs))FL.cs=L[0]?L[0].id:"";$("#cs").innerHTML=L.map(s=>`<option value="${s.id}" ${s.id==FL.cs?"selected":""}>${esc(s.nom)}</option>`).join("");consT()}
function consRows(){const s=SCH.find(x=>x.id==FL.cs);if(!s)return null;const st=[...s.st],all=st.length&&st.every(x=>done(x.n));all?st.sort((a,b)=>sc20(b.n)-sc20(a.n)||cmp(a,b)):st.sort(cmp);return{s,st,all}}
function consT(){const r=consRows();if(!r)return $("#ctb").innerHTML=empty("Aucune école","Aucune école validée à consulter.","","school");const{s,st,all}=r,g=st.filter(x=>x.sexe=="G").length;
$("#ctb").innerHTML=`<div class="kg">${kpi(esc(s.nom),bd(sp(s,"")),esc(s.codec)+" · Directeur : "+esc(s.directeur),"school")}${kpi("Effectif",st.length,`Garçons ${g} · Filles ${st.length-g}`,"users")}${kpi("Saisie",`${st.filter(x=>done(x.n)).length}/${st.length}`,ml(MO),"edit")}</div>${st.length?`<div class="tw"><table><tr><th>Rang</th><th class="l">Élève</th><th>Sexe</th><th>LC /100</th><th>Maths /100</th><th>DM /40</th><th>EDD /40</th><th>Total /280</th><th>Moy. /10</th></tr>${st.map((x,i)=>`<tr><td>${all?1+st.filter(o=>sc20(o.n)>sc20(x.n)).length:"–"}</td><td class="l">${fn(x)}</td><td>${x.sexe}</td>${Object.keys(D).map(d=>`<td>${x.n?f1(dt(x.n,d)):"–"}</td>`).join("")}<td>${x.n?f1(tot(x.n)):"–"}</td><td><b>${done(x.n)?f1(sc20(x.n)):"–"}</b></td></tr>`).join("")}<tr class="ft"><td colspan="3">Effectif total : ${st.length}</td><td colspan="6"></td></tr></table></div>`:empty("Aucun élève","Cette école n’a pas encore enregistré d’élèves.","","users")}`}
function expCons(){const r=consRows();if(!r)return;csv([["Élève","Sexe","LC","Maths","DM","EDD","Total /280","Moyenne /10"],...r.st.map(x=>[cap(x.prenom)+" "+x.nom.toUpperCase(),x.sexe,...Object.keys(D).map(d=>x.n?dt(x.n,d):""),x.n?tot(x.n):"",done(x.n)?f1(sc20(x.n)):""])],"notes-"+slug(r.s.nom)+"-"+MO+".csv")}

/* ===== ADMINISTRATION : fiche d'une école ===== */
async function openSch(id){const s=SCH.find(x=>x.id==id);if(!s)return;const ds=s.st.filter(x=>done(x.n)),low=ds.filter(x=>sc20(x.n)<5),al=[],g=s.st.filter(x=>x.sexe=="G").length;
Object.keys(D).forEach(d=>{if(ds.length){const v=avg(ds.map(x=>dt(x.n,d)/D[d][1]*100));if(v<50)al.push(`${D[d][0]} : score de ${Math.round(v)} % (sous 50 %). Piste : ${SOL[d]}`)}});
if(low.length)al.push(`${low.length} élève(s) sous 5/10 : ${low.map(fn).join(", ")}. Piste : soutien individualisé et suivi hebdomadaire.`);
const rk=[...ds].sort((a,b)=>sc20(b.n)-sc20(a.n)),d=document.createElement("div");d.className="dr";d.id="drw";d.onclick=e=>{if(e.target==d)d.remove()};
d.innerHTML=`<div class="dp"><div class="tbr" style="justify-content:space-between"><div><h2>${esc(s.nom)}</h2><span class="mu">${esc(s.codec)} · Directeur : ${esc(s.directeur)}</span></div><button class="btn" onclick="this.closest('.dr').remove()">${ic("x",16)} Fermer</button></div>
<div class="kg">${kpi("% total · "+ml(MO),bd(sp(s,"")),"","chart")}${kpi("% garçons",bd(sp(s,"G")),"","users")}${kpi("% filles",bd(sp(s,"F")),"","users")}${kpi("Effectif total",s.st.length,`Garçons ${g} · Filles ${s.st.length-g}`,"school")}</div>
<div class="card"><h3>Évolution mensuelle</h3><div id="hs"><div class="sk" style="height:140px"></div></div></div>
<div class="card"><h3>Alertes · ${ml(MO)}</h3>${al.length?`<ul style="margin:0;padding-left:18px">${al.map(a=>`<li>${a}</li>`).join("")}</ul>`:`<p class="mu" style="margin:0">Aucune alerte pour ce mois.</p>`}</div>
<h3>Classement des élèves · ${ml(MO)}</h3><div class="tw"><table><tr><th>Rang</th><th class="l">Élève</th><th>Sexe</th><th>Moyenne /10</th></tr>${rk.map((x,i)=>`<tr class="rw ${sc20(x.n)>5?"g":"r"}"><td>${i+1}</td><td class="l">${fn(x)}</td><td>${x.sexe}</td><td><b>${f1(sc20(x.n))}</b></td></tr>`).join("")||"<tr><td colspan=4>Aucun élève complet ce mois-ci.</td></tr>"}<tr class="ft"><td colspan="2">Effectif total : ${s.st.length}</td><td colspan="2"></td></tr></table></div></div>`;
document.body.appendChild(d);hist(s)}
async function hist(s){const el=$("#hs");if(!el)return;try{const NM=await notesAll(s.st.map(x=>x.id)),ms_=Object.keys(NM).sort();if(!ms_.length)return el.innerHTML=`<p class="mu">Aucune saisie pour le moment.</p>`;
let prev=null;const rows=ms_.map(m=>{const it=s.st.map(x=>({sexe:x.sexe,n:NM[m][x.id]})),p=rate(it),n=it.filter(x=>done(x.n)).length,d=prev==null||p==null?null:p-prev;if(p!=null)prev=p;return{m,it,p,n,d}});
el.innerHTML=line(rows.filter(r=>r.p!=null).map(r=>({l:ms(r.m),v:r.p})))+`<div class="tw" style="margin-top:12px"><table><tr><th class="l">Mois</th><th>Élèves saisis</th><th>% total</th><th>Évolution</th><th>% garçons</th><th>% filles</th></tr>${rows.map(r=>`<tr><td class="l"><b>${ml(r.m)}</b></td><td>${prog(r.n,s.st.length)}</td><td>${bd(r.p)}</td><td>${r.d==null?"–":r.d>0?`<span class="ok">▲ +${f1(r.d)} pts</span>`:r.d<0?`<span style="color:var(--ko)">▼ ${f1(r.d)} pts</span>`:"="}</td><td>${bd(rate(r.it.filter(x=>x.sexe=="G")))}</td><td>${bd(rate(r.it.filter(x=>x.sexe=="F")))}</td></tr>`).join("")}</table></div>`}catch(e){el.innerHTML=`<p class="err">${esc(e.message)}</p>`}}

/* ===== GESTION DES ÉCOLES (principal) ===== */
V.ge=async()=>{const[ec,cd,ins,pf,pw,pm]=await Promise.all([all(()=>sb.from("ecoles").select("*").order("nom").order("id")),all(()=>sb.from("codecs").select("*").order("nom").order("id")),all(()=>sb.from("inspecteurs").select("*").order("nom")),all(()=>sb.from("profiles").select("id,login").eq("role","ecole").order("id")),all(()=>sb.from("ecole_passwords").select("*").order("user_id")),sb.from("parametres").select("*").eq("cle","code_invitation").maybeSingle()]);
const lg={},mp={};pf.forEach(p=>lg[p.id]=p.login);pw.forEach(p=>mp[p.user_id]=p.mot_de_passe);ECD={ec,cd,ins,lg,mp,code:pm.data?pm.data.valeur:""};geDraw()};
function geDraw(){const{ec}=ECD,pend=ec.filter(e=>e.statut=="en_attente").length;
$("#vw").innerHTML=`<div class="tbr"><div class="seg">${[["ec",`Écoles (${ec.length})${pend?" · "+pend+" en attente":""}`],["cd","CODEC et inspecteurs"],["iv","Code d’invitation"]].map(x=>`<button class="${FL.gt==x[0]?"on":""}" onclick="FL.gt='${x[0]}';geDraw()">${x[1]}</button>`).join("")}</div></div><div id="gb"></div>`;
FL.gt=="ec"?geEc():FL.gt=="cd"?geCd():geIv()}
const idOf=e=>{const l=ECD.lg[e.user_id];return l&&slug(e.directeur)!=l?e.directeur+" "+e.nom:e.directeur};
function geEc(){$("#gb").innerHTML=`<div class="tbr"><div class="sb">${ic("search")}<input placeholder="Rechercher : école, directeur, CODEC, identifiant" value="${esc(FL.eq)}" oninput="FL.eq=this.value;ecTable()"></div></div><div class="tw" id="et"></div>`;ecTable()}
function ecTable(){const{ec,cd,mp}=ECD,q=FL.eq.toLowerCase(),cn={};cd.forEach(c=>cn[c.id]=c.nom);
const R=ec.filter(e=>!q||[e.nom,e.directeur,cn[e.codec_id]||"",idOf(e)].join(" ").toLowerCase().includes(q)).sort((a,b)=>(a.statut=="en_attente"?0:1)-(b.statut=="en_attente"?0:1));
const o=(L,v)=>L.map(x=>`<option value="${x[0]}" ${x[0]==v?"selected":""}>${esc(x[1])}</option>`).join("");
$("#et").innerHTML=R.length?`<table><tr><th class="l">École</th><th>Identifiant</th><th>Mot de passe</th><th>CODEC</th><th>Statut</th><th>Actions</th></tr>${R.map(e=>`<tr><td class="l"><b>${esc(e.nom)}</b></td><td><code>${esc(idOf(e))}</code></td><td>${mp[e.user_id]?sec(mp[e.user_id])+` <span class="mu">provisoire</span>`:`<span class="mu">choisi par l’école</span>`}</td>
<td><select onchange="upEc('${e.id}',{codec_id:this.value||null})"><option value="">–</option>${o(cd.map(c=>[c.id,c.nom]),e.codec_id)}</select></td><td><select onchange="upEc('${e.id}',{statut:this.value})">${o([["en_attente","⏳ En attente"],["valide","✅ Validée"],["suspendu","⛔ Suspendue"]],e.statut)}</select></td>
<td style="display:flex;gap:6px;justify-content:center"><button class="ib sm" style="background:#1fa855;color:#fff;border-color:#1fa855" title="Envoyer par WhatsApp" onclick="waEc('${e.user_id}')">${ic("msg",15)}</button><button class="ib sm" title="Nouveau mot de passe" onclick="newPw('${e.user_id}')">${ic("key",15)}</button><button class="ib sm" title="Supprimer" onclick="delEc('${e.user_id}')">${ic("trash",15)}</button></td></tr>`).join("")}</table>`:empty("Aucune école","Aucune école ne correspond à votre recherche.","","school")}
function geCd(){const{cd,ins}=ECD,o=(L,v)=>L.map(x=>`<option value="${x[0]}" ${x[0]==v?"selected":""}>${esc(x[1])}</option>`).join("");
$("#gb").innerHTML=`<div class="g2"><div class="card"><div class="tbr" style="justify-content:space-between"><h3 style="margin:0">CODEC (${cd.length})</h3><button class="btn pr sm" onclick="addCd()">${ic("plus",15)} Ajouter</button></div>${cd.map(c=>`<div class="tbr"><input value="${esc(c.nom)}" onchange="renCd('${c.id}',this.value)" style="flex:1"><select onchange="setIns('${c.id}',this.value)"><option value="">Aucun inspecteur</option>${o(ins.map(x=>[x.id,x.nom]),c.inspecteur_id)}</select><button class="ib sm" title="Supprimer" onclick="delCd('${c.id}')">${ic("trash",15)}</button></div>`).join("")||`<p class="mu">Aucun CODEC enregistré.</p>`}</div>
<div class="card"><div class="tbr" style="justify-content:space-between"><h3 style="margin:0">Inspecteurs (${ins.length})</h3><button class="btn pr sm" onclick="addIns()">${ic("plus",15)} Ajouter</button></div><p class="mu">Chaque inspecteur gère deux CODEC.</p>${ins.map(x=>{const L=cd.filter(c=>c.inspecteur_id==x.id);return`<div class="tbr"><div style="flex:1"><b>${esc(x.nom)}</b><br><span class="mu">${L.map(c=>esc(c.nom)).join(", ")||"aucun CODEC"}${L.length>2?" ⚠️ plus de deux":""}</span></div><button class="ib sm" title="Supprimer" onclick="delIns('${x.id}')">${ic("trash",15)}</button></div>`}).join("")||`<p class="mu">Aucun inspecteur enregistré.</p>`}</div></div>`}
function geIv(){$("#gb").innerHTML=`<div class="card" style="max-width:480px"><h3>Code d’invitation</h3><p class="mu">Les directeurs doivent saisir ce code pour inscrire leur école.</p><div class="tbr"><input id="ci" value="${esc(ECD.code)}" style="flex:1"><button class="btn pr" onclick="setCode()">Enregistrer</button></div></div>`}
const refresh=()=>{RC={};V.ge()};
const setCode=()=>chk(sb.from("parametres").update({valeur:$("#ci").value.trim()}).eq("cle","code_invitation"),()=>{ECD.code=$("#ci").value.trim()},"Code d’invitation enregistré.");
async function addCd(){const r=await modal({t:"Nouveau CODEC",b:`<label>Nom du CODEC</label><input id="mc">`,ok:"Ajouter",val:m=>{const v=m.querySelector("#mc").value.trim().toUpperCase();if(!v)throw"Saisissez un nom.";return v}});if(r)chk(sb.from("codecs").insert({nom:r}),refresh,"CODEC ajouté.")}
const renCd=(id,v)=>chk(sb.from("codecs").update({nom:v.trim().toUpperCase()}).eq("id",id),refresh,"CODEC renommé.");
async function delCd(id){if(await ask("Supprimer ce CODEC ?","Les écoles concernées n’auront plus de CODEC.","Supprimer",true))chk(sb.from("codecs").delete().eq("id",id),refresh,"CODEC supprimé.")}
async function setIns(cid,v){if(v&&ECD.cd.filter(c=>c.inspecteur_id==v&&c.id!=cid).length>=2&&!await ask("Déjà deux CODEC","Cet inspecteur gère déjà deux CODEC. Continuer ?","Continuer"))return geDraw();chk(sb.from("codecs").update({inspecteur_id:v||null}).eq("id",cid),refresh,"Inspecteur mis à jour.")}
async function addIns(){const o=ECD.cd.map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join(""),r=await modal({t:"Nouvel inspecteur",b:`<label>Nom de l’inspecteur</label><input id="mi"><label>CODEC 1</label><select id="m1"><option value="">–</option>${o}</select><label>CODEC 2</label><select id="m2"><option value="">–</option>${o}</select>`,ok:"Ajouter",val:m=>{const n=m.querySelector("#mi").value.trim();if(!n)throw"Saisissez le nom.";return{n,ids:[...new Set([m.querySelector("#m1").value,m.querySelector("#m2").value].filter(Boolean))]}}});
if(!r)return;const{data,error}=await sb.from("inspecteurs").insert({nom:r.n}).select().single();if(error)return toast(error.message,"er");if(r.ids.length)await chk(sb.from("codecs").update({inspecteur_id:data.id}).in("id",r.ids));toast("Inspecteur ajouté.");refresh()}
async function delIns(id){if(await ask("Supprimer cet inspecteur ?","Ses CODEC resteront, sans inspecteur.","Supprimer",true))chk(sb.from("inspecteurs").delete().eq("id",id),refresh,"Inspecteur supprimé.")}
const upEc=(id,o)=>chk(sb.from("ecoles").update(o).eq("id",id),()=>{RC={};const e=ECD.ec.find(x=>x.id==id);if(e)Object.assign(e,o)},"Modification enregistrée.");
async function newPw(u){if(await ask("Nouveau mot de passe","Un nouveau mot de passe provisoire sera généré. L’ancien ne fonctionnera plus et l’école devra en choisir un nouveau à sa prochaine connexion.","Générer"))chk(sb.rpc("changer_mdp_utilisateur",{p_user:u,p_mdp:rnd()}),refresh,"Nouveau mot de passe généré.")}
async function delEc(u){const e=ECD.ec.find(x=>x.user_id==u);if(await ask("Supprimer cette école ?",`<b>${esc(e.nom)}</b>, ses élèves et ses notes seront supprimés définitivement.`,"Supprimer",true))chk(sb.rpc("supprimer_utilisateur",{p_user:u}),refresh,"École supprimée.")}
async function waEc(u){const e=ECD.ec.find(x=>x.user_id==u),pw=ECD.mp[u];if(!pw)return toast("Cette école a choisi son mot de passe : générez-en un nouveau pour pouvoir l’envoyer.","er");const t=await askPhone();if(t)wa(t,idOf(e),pw)}

/* ===== GESTION DES ADMINISTRATEURS (principal) ===== */
V.ga=async()=>{ADD=await all(()=>sb.from("admin_passwords").select("*").order("login"));
$("#vw").innerHTML=`<div class="tbr"><div class="sb">${ic("search")}<input placeholder="Rechercher un administrateur" value="${esc(FL.aq)}" oninput="FL.aq=this.value;adTable()"></div><button class="btn pr" onclick="addAdm()">${ic("plus")} Nouvel administrateur</button></div><p class="mu">Les administrateurs secondaires consultent toutes les données, sans pouvoir rien modifier. Le mot de passe est généré par l’application ; affichez-le avec l’œil uniquement pour le transmettre.</p><div class="tw" id="at2"></div>`;adTable()};
function adTable(){const q=FL.aq.toLowerCase(),L=ADD.filter(a=>!q||a.login.toLowerCase().includes(q));
$("#at2").innerHTML=L.length?`<table><tr><th class="l">Identifiant</th><th>Mot de passe</th><th>Téléphone</th><th>Actions</th></tr>${L.map(a=>`<tr><td class="l"><b>${esc(a.login)}</b></td><td>${sec(a.mot_de_passe)}</td><td><input id="t_${a.user_id}" value="${esc(a.telephone||"")}" placeholder="77 123 45 67" inputmode="tel" onchange="setTel('${a.user_id}',this.value)" style="width:150px"></td>
<td style="display:flex;gap:6px;justify-content:center"><button class="btn wa sm" onclick="waAdm('${a.user_id}')">${ic("msg",15)} WhatsApp</button><button class="ib sm" title="Nouveau mot de passe" onclick="regAdm('${a.user_id}')">${ic("key",15)}</button><button class="ib sm" title="Supprimer" onclick="delAdm('${a.user_id}')">${ic("trash",15)}</button></td></tr>`).join("")}</table>`:empty("Aucun administrateur","Créez un administrateur secondaire pour lui donner un accès en lecture seule.",`<button class="btn pr" onclick="addAdm()">${ic("plus")} Nouvel administrateur</button>`,"shield")}
const setTel=(u,v)=>{const a=ADD.find(x=>x.user_id==u);chk(sb.from("admin_passwords").update({telephone:v.trim()}).eq("user_id",u),()=>{if(a)a.telephone=v.trim()},"Téléphone enregistré.")};
async function waAdm(u){const a=ADD.find(x=>x.user_id==u);let t=$("#t_"+u).value.trim();if(!t)t=await askPhone();if(t)wa(t,a.login,a.mot_de_passe)}
async function addAdm(){const r=await modal({t:"Nouvel administrateur (lecture seule)",b:`<label>Nom ou identifiant</label><input id="ma"><label>Téléphone WhatsApp (facultatif)</label><input id="mt" placeholder="77 123 45 67" inputmode="tel">`,ok:"Créer",val:m=>{const l=m.querySelector("#ma").value.trim();if(!l)throw"Saisissez un identifiant.";return{l,t:m.querySelector("#mt").value.trim()}}});if(!r)return;
const pw=rnd(),s2=supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}),x=await s2.auth.signUp({email:mail(r.l),password:pw});if(x.error||!x.data.user)return toast(x.error?x.error.message:"Création impossible (identifiant déjà utilisé ?)","er");
const{error}=await sb.rpc("creer_admin",{p_user:x.data.user.id,p_login:r.l,p_mdp:pw});if(error)return toast(error.message,"er");if(r.t)await sb.from("admin_passwords").update({telephone:r.t}).eq("user_id",x.data.user.id);toast("Administrateur créé.");V.ga()}
async function regAdm(u){if(await ask("Nouveau mot de passe","L’ancien mot de passe ne fonctionnera plus.","Générer"))chk(sb.rpc("changer_mdp_utilisateur",{p_user:u,p_mdp:rnd()}),()=>V.ga(),"Nouveau mot de passe généré.")}
async function delAdm(u){const a=ADD.find(x=>x.user_id==u);if(await ask("Supprimer cet administrateur ?",`<b>${esc(a.login)}</b> n’aura plus accès à l’application.`,"Supprimer",true))chk(sb.rpc("supprimer_utilisateur",{p_user:u}),()=>V.ga(),"Administrateur supprimé.")}

boot();
</script></body></html>
