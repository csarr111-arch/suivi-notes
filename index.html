st.forEach(s=>{const n=s.n||{};h+=`<tr data-id="${s.id}"><td>${rk(s)}</td><td class="ed" data-ed="el" data-id="${s.id}" title="Double-clic ou clic droit : modifier"><span class="dt ${dot(n)}" id="D${s.id}"></span>${fn(s)}</td><td class="ed" data-ed="el" data-id="${s.id}">${s.sexe}</td>`+F.map((f,i)=>`<td><input type="number" class="${nm(n[f[0]])?"fl":"em"}" inputmode="decimal" min="0" max="${f[3]}" step="0.25" data-s="${s.id}" data-k="${f[0]}" data-m="${f[3]}" value="${nm(n[f[0]])?n[f[0]]:""}" aria-label="${f[1]} ${f[2]}"></td>`+(last(i)?`<td class="tg" id="G${s.id}${f[1]}">${f1(dt(n,f[1]))}</td>`:"")).join("")+`<td id="T${s.id}">${f1(tot(n))}</td><td id="V${s.id}"><b>${done(n)?f1(sc20(n)):"–"}</b></td><td style="white-space:nowrap"><button class="ib sm" title="Modifier l’élève" onclick="editData('el','${s.id}')">${ic("edit",15)}</button><button class="ib sm" title="Supprimer l’élève" onclick="delEl('${s.id}')">${ic("trash",15)}</button></td></tr>`});

function live(id){const n=ST.N[id]||{};Object.keys(D).forEach(d=>{const g=$("#G"+id+d);if(g)g.textContent=f1(dt(n,d))});$("#T"+id).textContent=f1(tot(n));$("#V"+id).innerHTML="<b>"+(done(n)?f1(sc20(n)):"–")+"</b>";$("#D"+id).className="dt "+dot(n)}

function inp(e){const i=e.target;if(!i.dataset.s)return;let v=i.value===""?null:parseFloat(i.value.replace(",","."));const mx=+i.dataset.m;let bad=false;
if(v!=null&&(isNaN(v)||v<0)){v=0;i.value=0;bad=true}let msg=null;if(v>mx){v=mx;i.value=mx;bad=true}const gp=GR[i.dataset.k];if(v!=null&&gp){const o=ST.N[i.dataset.s]||{},oth=gp.g.filter(k=>k!=i.dataset.k).reduce((a,k)=>a+(nm(o[k])?o[k]:0),0);if(v+oth>gp.m){v=Math.max(0,gp.m-oth);i.value=v;bad=true;msg=`Le total des ressources ${gp.n} ne peut pas dépasser ${gp.m} (il reste ${Math.max(0,gp.m-oth)} à répartir).`}}if(bad){i.classList.add("bd2");toast(msg||`La note maximale est ${mx}.`,"er");setTimeout(()=>i.classList.remove("bd2"),700)}

const cm={},NM={},by={};cd.forEach(c=>cm[c.id]=c);nt.forEach(r=>NM[r.eleve_id]=r);el.forEach(s=>(by[s.ecole_id]=by[s.ecole_id]||[]).push({...s,n:NM[s.id]}));

function alerts(){return SCH.map(s=>{const n=s.st.length,ds=s.st.filter(x=>done(x.n)).length,p=sp(s,""),r=[];
if(!n)r.push(["ko","Aucun élève enregistré"]);else if(!ds)r.push(["ko","Aucune saisie complète ce mois"]);else{if(p<=50)r.push(["ko",`Pourcentage de réussite faible (${f1(p)} %)`]);if(ds<n)r.push(["wr",`Saisie incomplète (${ds}/${n} élèves)`])}return{s,r}}).filter(a=>a.r.length).sort((a,b)=>b.r.filter(x=>x[0]=="ko").length-a.r.filter(x=>x[0]=="ko").length||a.s.nom.localeCompare(b.s.nom,"fr"))}

async function hist(s){const el=$("#hs");if(!el)return;try{const NM=await notesAll(s.st.map(x=>x.id)),ms_=Object.keys(NM).sort();if(!ms_.length)return el.innerHTML=`<p class="mu">Aucune saisie pour le moment.</p>`;
let prev=null;const rows=ms_.map(m=>{const it=s.st.map(x=>({sexe:x.sexe,n:NM[m][x.id]})),p=rate(it),n=it.filter(x=>done(x.n)).length,d=prev==null||p==null?null:p-prev;if(p!=null)prev=p;return{m,it,p,n,d}});
el.innerHTML=line(rows.filter(r=>r.p!=null).map(r=>({l:ms(r.m),v:r.p})))+`<div class="tw" style="margin-top:12px"><table><tr><th class="l">Mois</th><th>Élèves saisis</th><th>% total</th><th>Évolution</th><th>% garçons</th><th>% filles</th></tr>${rows.map(r=>`<tr><td class="l"><b>${ml(r.m)}</b></td><td>${prog(r.n,s.st.length)}</td><td>${bd(r.p)}</td><td>${r.d==null?"–":r.d>0?`<span class="ok">▲ +${f1(r.d)} pts</span>`:r.d<0?`<span style="color:var(--ko)">▼ ${f1(r.d)} pts</span>`:"="}</td><td>${bd(rate(r.it.filter(x=>x.sexe=="G")))}</td><td>${bd(rate(r.it.filter(x=>x.sexe=="F")))}</td></tr>`).join("")}</table></div>`}catch(e){el.innerHTML=`<p class="err">${esc(e.message)}</p>`}}

/* ===== GESTION DES ÉCOLES (principal) ===== */
V.ge=async()=>{const[ec,cd,ins,ds,pf,pw,pm]=await Promise.all([all(()=>sb.from("ecoles").select("*").order("nom").order("id")),all(()=>sb.from("codecs").select("*").order("nom").order("id")),all(()=>sb.from("inspecteurs").select("*").order("nom")),all(()=>sb.from("districts").select("*").order("nom")).catch(()=>[]),all(()=>sb.from("profiles").select("id,login").eq("role","ecole").order("id")),all(()=>sb.from("ecole_passwords").select("*").order("user_id")),sb.from("parametres").select("*").eq("cle","code_invitation").maybeSingle()]);
const lg={},mp={};pf.forEach(p=>lg[p.id]=p.login);pw.forEach(p=>mp[p.user_id]=p.mot_de_passe);ECD={ec,cd,ins,ds,lg,mp,code:pm.data?pm.data.valeur:""};geDraw()};
function geDraw(){const{ec}=ECD,pend=ec.filter(e=>e.statut=="en_attente").length;
$("#vw").innerHTML=`<div class="tbr"><div class="seg">${[["ec",`Écoles (${ec.length})${pend?" · "+pend+" en attente":""}`],["cd","Districts et CODEC"],["iv","Code d’invitation"]].map(x=>`<button class="${FL.gt==x[0]?"on":""}" onclick="FL.gt='${x[0]}';geDraw()">${x[1]}</button>`).join("")}</div></div><div id="gb"></div>`;
FL.gt=="ec"?geEc():FL.gt=="cd"?geCd():geIv()}
const idOf=e=>{const l=ECD.lg[e.user_id];if(l&&/^\d{9,}$/.test(l))return l;return l&&slug(e.directeur)!=l?e.directeur+" "+e.nom:e.directeur};
function geEc(){$("#gb").innerHTML=`<div class="tbr"><div class="sb">${ic("search")}<input placeholder="Rechercher : école, directeur, CODEC, identifiant" value="${esc(FL.eq)}" oninput="FL.eq=this.value;ecTable()"></div></div><div class="tw" id="et"></div>`;ecTable()}
const cOptG=v=>{const{cd,ds}=ECD,g=(l,L)=>L.length?`<optgroup label="${esc(l)}">${L.map(c=>`<option value="${c.id}" ${c.id==v?"selected":""}>${esc(c.nom)}</option>`).join("")}</optgroup>`:"";return ds.map(d=>g("District "+d.nom,cd.filter(c=>c.district_id==d.id))).join("")+g("Sans district",cd.filter(c=>!ds.some(d=>d.id==c.district_id)))};
function ecTable(){const{ec,cd,mp}=ECD,q=FL.eq.toLowerCase(),cn={};cd.forEach(c=>cn[c.id]=c.nom);
const R=ec.filter(e=>!q||[e.nom,e.directeur,e.telephone||"",cn[e.codec_id]||"",idOf(e)].join(" ").toLowerCase().includes(q)).sort((a,b)=>(a.statut=="en_attente"?0:1)-(b.statut=="en_attente"?0:1));
const o=(L,v)=>L.map(x=>`<option value="${x[0]}" ${x[0]==v?"selected":""}>${esc(x[1])}</option>`).join("");
$("#et").innerHTML=R.length?`<table><tr><th class="l">École</th><th>Identifiant</th><th>Mot de passe</th><th>CODEC</th><th>Statut</th><th>Actions</th></tr>${R.map(e=>`<tr><td class="l ed" data-ed="ec" data-id="${e.id}" title="Double-clic ou clic droit : modifier"><b>${esc(e.nom)}</b><br><small class="mu">${e.telephone?"📱 "+esc(e.telephone):"Aucun numéro"}</small></td><td><code>${esc(idOf(e))}</code></td><td>${mp[e.user_id]?sec(mp[e.user_id])+` <span class="mu">provisoire</span>`:`<span class="mu">choisi par l’école</span>`}</td>
<td><select onchange="upEc('${e.id}',{codec_id:this.value||null})"><option value="">–</option>${cOptG(e.codec_id)}</select></td><td><select onchange="upEc('${e.id}',{statut:this.value})">${o([["en_attente","⏳ En attente"],["valide","✅ Validée"],["suspendu","⛔ Suspendue"]],e.statut)}</select></td>
<td style="display:flex;gap:6px;justify-content:center"><button class="ib sm" style="background:#1fa855;color:#fff;border-color:#1fa855" title="Envoyer par WhatsApp" onclick="waEc('${e.user_id}')">${ic("msg",15)}</button><button class="ib sm" title="Nouveau mot de passe" onclick="newPw('${e.user_id}')">${ic("key",15)}</button><button class="ib sm" title="Supprimer" onclick="delEc('${e.user_id}')">${ic("trash",15)}</button></td></tr>`).join("")}</table>`:empty("Aucune école","Aucune école ne correspond à votre recherche.","","school")}
function geCd(){const{cd,ins,ds}=ECD,o=(L,v)=>L.map(x=>`<option value="${x[0]}" ${x[0]==v?"selected":""}>${esc(x[1])}</option>`).join(""),dO=v=>`<option value="">Sans district</option>${o(ds.map(d=>[d.id,d.nom]),v)}`,orph=cd.filter(c=>!ds.some(d=>d.id==c.district_id)),
row=c=>`<div class="tbr"><input value="${esc(c.nom)}" onchange="renCd('${c.id}',this.value)" style="flex:1;min-width:140px"><select onchange="setCdDs('${c.id}',this.value)">${dO(c.district_id)}</select><button class="ib sm" title="Supprimer le CODEC" onclick="delCd('${c.id}')">${ic("trash",15)}</button></div>`;
$("#gb").innerHTML=`<div class="card"><div class="tbr" style="justify-content:space-between"><h3 style="margin:0">Inspecteurs (${ins.length})</h3><button class="btn pr sm" onclick="addIns()">${ic("plus",15)} Ajouter</button></div>${ins.map(x=>`<div class="tbr"><input value="${esc(x.nom)}" onchange="renIns('${x.id}',this.value)" style="flex:1;min-width:140px"><span class="mu">${ds.filter(d=>d.inspecteur_id==x.id).length} district(s)</span><button class="ib sm" title="Supprimer l’inspecteur" onclick="delIns('${x.id}')">${ic("trash",15)}</button></div>`).join("")||`<p class="mu">Aucun inspecteur enregistré.</p>`}</div>
<div class="tbr" style="justify-content:space-between"><h3 style="margin:8px 0">Districts (${ds.length}) <span class="mu">· nombre illimité</span></h3><button class="btn pr" onclick="addDs()">${ic("plus")} Nouveau district</button></div>
${ds.map(d=>{const L=cd.filter(c=>c.district_id==d.id),x=ins.find(i=>i.id==d.inspecteur_id);return`<details class="nd" open><summary><span class="nt">${ic("folder",16)} ${esc(d.nom)}</span><span class="mu">${L.length} CODEC · ${x?esc(x.nom):"sans inspecteur"}</span></summary><div class="nb"><div class="tbr"><input value="${esc(d.nom)}" onchange="renDs('${d.id}',this.value)" style="flex:1;min-width:140px"><select onchange="setDsIns('${d.id}',this.value)"><option value="">Aucun inspecteur</option>${o(ins.map(i=>[i.id,i.nom]),d.inspecteur_id)}</select><button class="ib sm" title="Supprimer le district" onclick="delDs('${d.id}')">${ic("trash",15)}</button></div><h4>CODEC du district</h4>${L.map(row).join("")||`<p class="mu">Aucun CODEC dans ce district.</p>`}<button class="btn sm" onclick="addCd('${d.id}')">${ic("plus",15)} Ajouter un CODEC</button></div></details>`}).join("")||empty("Aucun district","Créez un district, puis ajoutez-y des CODEC.",`<button class="btn pr" onclick="addDs()">${ic("plus")} Nouveau district</button>`,"folder")}
<details class="nd" ${orph.length?"open":""}><summary><span class="nt">${ic("layers",16)} CODEC sans district</span><span class="mu">${orph.length} CODEC</span></summary><div class="nb">${orph.map(row).join("")||`<p class="mu">Tous les CODEC ont un district.</p>`}<button class="btn sm" onclick="addCd('')">${ic("plus",15)} Ajouter un CODEC</button></div></details>`}
function geIv(){$("#gb").innerHTML=`<div class="card" style="max-width:480px"><h3>Code d’invitation</h3><p class="mu">Les directeurs doivent saisir ce code pour inscrire leur école.</p><div class="tbr"><input id="ci" value="${esc(ECD.code)}" style="flex:1"><button class="btn pr" onclick="setCode()">Enregistrer</button></div></div>`}
const refresh=()=>{RC={};V.ge()};
const setCode=()=>chk(sb.from("parametres").update({valeur:$("#ci").value.trim()}).eq("cle","code_invitation"),()=>{ECD.code=$("#ci").value.trim()},"Code d’invitation enregistré.");
async function addCd(did){const r=await modal({t:"Nouveau CODEC",b:`<label>Nom du CODEC</label><input id="mc">`,ok:"Ajouter",val:m=>{const v=m.querySelector("#mc").value.trim().toUpperCase();if(!v)throw"Saisissez un nom.";return v}});if(r)chk(sb.from("codecs").insert({nom:r,district_id:did||null}),refresh,"CODEC ajouté.")}
const renCd=(id,v)=>chk(sb.from("codecs").update({nom:v.trim().toUpperCase()}).eq("id",id),refresh,"CODEC renommé.");
const setCdDs=(id,v)=>chk(sb.from("codecs").update({district_id:v||null}).eq("id",id),refresh,"CODEC déplacé.");
async function delCd(id){if(await ask("Supprimer ce CODEC ?","Les écoles concernées n’auront plus de CODEC.","Supprimer",true))chk(sb.from("codecs").delete().eq("id",id),refresh,"CODEC supprimé.")}
async function addIns(){const r=await modal({t:"Nouvel inspecteur",b:`<label>Nom de l’inspecteur</label><input id="mi">`,ok:"Ajouter",val:m=>{const n=m.querySelector("#mi").value.trim();if(!n)throw"Saisissez le nom.";return n}});if(r)chk(sb.from("inspecteurs").insert({nom:r}),refresh,"Inspecteur ajouté.")}
const renIns=(id,v)=>chk(sb.from("inspecteurs").update({nom:v.trim()}).eq("id",id),refresh,"Inspecteur renommé.");
async function delIns(id){if(await ask("Supprimer cet inspecteur ?","Ses districts resteront, sans inspecteur.","Supprimer",true))chk(sb.from("inspecteurs").delete().eq("id",id),refresh,"Inspecteur supprimé.")}
async function addDs(){const o=ECD.ins.map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join(""),r=await modal({t:"Nouveau district",b:`<label>Nom du district</label><input id="md"><label>Inspecteur responsable</label><select id="mi"><option value="">Aucun pour le moment</option>${o}</select>`,ok:"Créer",val:m=>{const n=m.querySelector("#md").value.trim();if(!n)throw"Saisissez le nom du district.";return{n,i:m.querySelector("#mi").value||null}}});if(r)chk(sb.from("districts").insert({nom:r.n,inspecteur_id:r.i}),refresh,"District créé.")}
const renDs=(id,v)=>chk(sb.from("districts").update({nom:v.trim()}).eq("id",id),refresh,"District renommé.");
const setDsIns=(id,v)=>chk(sb.from("districts").update({inspecteur_id:v||null}).eq("id",id),refresh,"Inspecteur du district mis à jour.");
async function delDs(id){if(await ask("Supprimer ce district ?","Ses CODEC resteront, sans district.","Supprimer",true))chk(sb.from("districts").delete().eq("id",id),refresh,"District supprimé.")}
const upEc=(id,o)=>chk(sb.from("ecoles").update(o).eq("id",id),()=>{RC={};const e=ECD.ec.find(x=>x.id==id);if(e)Object.assign(e,o)},"Modification enregistrée.");
async function newPw(u){if(await ask("Nouveau mot de passe","Un nouveau mot de passe provisoire sera généré. L’ancien ne fonctionnera plus et l’école devra en choisir un nouveau à sa prochaine connexion.","Générer"))chk(sb.rpc("changer_mdp_utilisateur",{p_user:u,p_mdp:rnd()}),refresh,"Nouveau mot de passe généré.")}
async function delEc(u){const e=ECD.ec.find(x=>x.user_id==u);if(await ask("Supprimer cette école ?",`<b>${esc(e.nom)}</b>, ses élèves et ses notes seront supprimés définitivement.`,"Supprimer",true))chk(sb.rpc("supprimer_utilisateur",{p_user:u}),refresh,"École supprimée.")}
async function waEc(u){const e=ECD.ec.find(x=>x.user_id==u),pw=ECD.mp[u];if(!pw)return toast("Cette école a choisi son mot de passe : générez-en un nouveau pour pouvoir l’envoyer.","er");let t=e.telephone;if(!t){t=await askPhone();if(t){const{error}=await sb.from("ecoles").update({telephone:t}).eq("id",e.id);if(!error)e.telephone=t}}if(t)wa(t,idOf(e),pw)}

/* ===== GESTION DES ADMINISTRATEURS (principal) ===== */
V.ga=async()=>{await loadRes();ADD=await all(()=>sb.from("admin_passwords").select("*").order("login"));
$("#vw").innerHTML=`<div class="tbr"><div class="sb">${ic("search")}<input placeholder="Rechercher un administrateur" value="${esc(FL.aq)}" oninput="FL.aq=this.value;adTable()"></div><button class="btn pr" onclick="addAdm()">${ic("plus")} Nouvel administrateur</button></div><p class="mu">Touchez le nom d’un administrateur pour déplier ses districts, ses CODEC et ses écoles. Tous les administrateurs consultent l’IEF et tout le site, sans pouvoir rien modifier. Le mot de passe est généré par l’application ; affichez-le avec l’œil uniquement pour le transmettre.</p><div id="at2"></div>`;adTable()};
function adTable(){const q=FL.aq.toLowerCase(),L=ADD.filter(a=>!q||a.login.toLowerCase().includes(q));
$("#at2").innerHTML=L.length?L.map(a=>{const x=INS.find(i=>i.id==a.inspecteur_id);return`<details class="nd"><summary><span class="nt">${ic("shield",16)} ${esc(a.login)}</span><span class="mu">${x?"Inspecteur : "+esc(x.nom):"Aucun inspecteur associé"}</span></summary><div class="nb">
<div class="tbr" style="margin-top:10px"><span class="mu">Mot de passe</span>${sec(a.mot_de_passe)}<input id="t_${a.user_id}" value="${esc(a.telephone||"")}" placeholder="Téléphone 77 123 45 67" inputmode="tel" onchange="setTel('${a.user_id}',this.value)" style="width:170px"><button class="btn wa sm" onclick="waAdm('${a.user_id}')">${ic("msg",15)} WhatsApp</button><button class="ib sm" title="Nouveau mot de passe" onclick="regAdm('${a.user_id}')">${ic("key",15)}</button><button class="ib sm" title="Supprimer" onclick="delAdm('${a.user_id}')">${ic("trash",15)}</button></div>
<div class="tbr"><span class="mu">Inspecteur associé</span><select onchange="setAI('${a.user_id}',this.value)"><option value="">Aucun</option>${INS.map(i=>`<option value="${i.id}" ${i.id==a.inspecteur_id?"selected":""}>${esc(i.nom)}</option>`).join("")}</select></div>
<h4>Districts</h4>${x?(insDistricts(x)||`<p class="mu">Aucun district attribué à cet inspecteur.</p>`):`<p class="mu">Associez un inspecteur pour afficher ses districts.</p>`}</div></details>`}).join(""):empty("Aucun administrateur","Créez un administrateur secondaire pour lui donner un accès en lecture seule.",`<button class="btn pr" onclick="addAdm()">${ic("plus")} Nouvel administrateur</button>`,"shield")}
const setTel=(u,v)=>{const a=ADD.find(x=>x.user_id==u);chk(sb.from("admin_passwords").update({telephone:v.trim()}).eq("user_id",u),()=>{if(a)a.telephone=v.trim()},"Téléphone enregistré.")};
const setAI=(u,v)=>{const a=ADD.find(x=>x.user_id==u);chk(sb.from("admin_passwords").update({inspecteur_id:v||null}).eq("user_id",u),()=>{if(a)a.inspecteur_id=v||null;adTable()},"Inspecteur associé enregistré.")};
async function waAdm(u){const a=ADD.find(x=>x.user_id==u);let t=$("#t_"+u).value.trim();if(!t)t=await askPhone();if(t)wa(t,a.login,a.mot_de_passe)}
async function addAdm(){const o=INS.map(x=>`<option value="${x.id}">${esc(x.nom)}</option>`).join(""),r=await modal({t:"Nouvel administrateur (lecture seule)",b:`<label>Nom ou identifiant</label><input id="ma"><label>Inspecteur associé (facultatif)</label><select id="mi"><option value="">Aucun</option>${o}</select><label>Téléphone WhatsApp (facultatif)</label><input id="mt" placeholder="77 123 45 67" inputmode="tel">`,ok:"Créer",val:m=>{const l=m.querySelector("#ma").value.trim();if(!l)throw"Saisissez un identifiant.";return{l,t:m.querySelector("#mt").value.trim(),i:m.querySelector("#mi").value||null}}});if(!r)return;
const pw=rnd(),s2=supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}}),x=await s2.auth.signUp({email:mail(r.l),password:pw});if(x.error||!x.data.user)return toast(x.error?x.error.message:"Création impossible (identifiant déjà utilisé ?)","er");
const{error}=await sb.rpc("creer_admin",{p_user:x.data.user.id,p_login:r.l,p_mdp:pw});if(error)return toast(error.message,"er");const up={};if(r.t)up.telephone=r.t;if(r.i)up.inspecteur_id=r.i;if(Object.keys(up).length){const e2=(await sb.from("admin_passwords").update(up).eq("user_id",x.data.user.id)).error;if(e2)toast(dbe(e2),"er")}toast("Administrateur créé.");V.ga()}
async function regAdm(u){if(await ask("Nouveau mot de passe","L’ancien mot de passe ne fonctionnera plus.","Générer"))chk(sb.rpc("changer_mdp_utilisateur",{p_user:u,p_mdp:rnd()}),()=>V.ga(),"Nouveau mot de passe généré.")}
async function delAdm(u){const a=ADD.find(x=>x.user_id==u);if(await ask("Supprimer cet administrateur ?",`<b>${esc(a.login)}</b> n’aura plus accès à l’application.`,"Supprimer",true))chk(sb.rpc("supprimer_utilisateur",{p_user:u}),()=>V.ga(),"Administrateur supprimé.")}

boot();
</script></body></html>
