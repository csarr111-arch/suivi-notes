<!doctype html>
<html lang="fr"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Suivi des notes CM2 – IEF de Tivaouane</title>
<style>
:root{--bg:#f6f7f9;--cd:#fff;--tx:#1b2430;--mu:#5d6b7c;--bd:#dfe3e8;--ac:#1f6feb;--ok:#1a7f4b;--wa:#b7791f;--ko:#c0392b}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--cd:#1b222b;--tx:#e8edf3;--mu:#9aa7b6;--bd:#2c3642;--ac:#5aa2ff;--ok:#4cc38a;--wa:#e0a84a;--ko:#ff7a6b;color-scheme:dark}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
main{max-width:1000px;margin:0 auto;padding:14px}
h1{font-size:18px;margin:0}h3{font-size:15px;margin:18px 0 6px}.mu{color:var(--mu);font-size:13px}
.box{max-width:380px;margin:40px auto;background:var(--cd);border:1px solid var(--bd);border-radius:12px;padding:18px;display:flex;flex-direction:column;gap:10px}
.top{display:flex;justify-content:space-between;gap:8px;align-items:center;margin-bottom:8px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:10px 0}.hide{display:none}
button,select,input{font:inherit;color:var(--tx);background:var(--cd);border:1px solid var(--bd);border-radius:8px;padding:7px 10px}
button{cursor:pointer}button.on{background:var(--ac);border-color:var(--ac);color:#fff}
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px;margin:10px 0}
.c{background:var(--cd);border:1px solid var(--bd);border-radius:10px;padding:10px}.c b{display:block;font-size:20px}
.w{overflow-x:auto;background:var(--cd);border:1px solid var(--bd);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:13px}th,td{padding:5px 6px;border-bottom:1px solid var(--bd);text-align:center;white-space:nowrap}
th{color:var(--mu);font-weight:600}td:nth-child(2),th:nth-child(2){text-align:left}
td input[type=number]{width:56px;padding:4px;text-align:center}.tg{background:var(--bg);font-weight:600}
details{background:var(--cd);border:1px solid var(--bd);border-radius:10px;margin:8px 0;padding:8px 10px}
summary{cursor:pointer;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.ok{color:var(--ok)}.wa{color:var(--wa)}.err,.ko{color:var(--ko)}li{margin:4px 0}code{background:var(--bg);padding:2px 6px;border-radius:6px}
</style></head><body><main id="app">Chargement…</main>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.49.4/dist/umd/supabase.js"></script>
<script>
const U="https://uoolsewfhnwlknvmelix.supabase.co",K="sb_publishable_MohLgsB6-c2KfbXKZ2VuTg_rauPkc1w";
const sb=supabase.createClient(U,K);
const F=[["lc_r","LC","Ressources",40],["lc_c","LC","Compétence",60],["ma_r","Maths","Ressources",40],["ma_c","Maths","Compétence",60],["dm_h","DM","Histoire",8],["dm_g","DM","Géographie",8],["dm_s","DM","IST",8],["dm_c","DM","Compétence",16],["edd_v","EDD","Vivre ensemble",12],["edd_m","EDD","Vivre dans son milieu",12],["edd_c","EDD","Compétence",16]];
const D={LC:["Langue et Communication",100],Maths:["Mathématiques",100],DM:["Découverte du Monde",40],EDD:["Éducation au Développement Durable",40]};
const SOL={LC:"lecture à voix haute et dictée quotidiennes, petits écrits à produire en classe.",Maths:"calcul mental chaque jour, problèmes guidés, manipulation de matériel.",DM:"observations et expériences simples, cartes et frises construites avec les élèves.",EDD:"projets de classe sur le milieu local (propreté, jardin), débats sur le vivre ensemble."};
const $=s=>document.querySelector(s),esc=t=>String(t??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const app=h=>{$("#app").innerHTML=h},msg=t=>`<p class="err">${t}</p>`;
const nm=v=>typeof v==="number"&&!isNaN(v),last=i=>!F[i+1]||F[i+1][1]!=F[i][1];
const avg=a=>a.length?a.reduce((x,y)=>x+y,0)/a.length:null;
const f1=v=>v==null?"–":(Math.round(v*10)/10).toString().replace(".",","),pc=v=>v==null?"–":f1(v)+" %";
const slug=t=>t.normalize("NFD").replace(/[\u0300-\u036f]/g,"").toLowerCase().replace(/[^a-z0-9]+/g,".").replace(/^\.+|\.+$/g,"");
const mail=l=>l.includes("@")?l.trim():slug(l)+"@ief-tivaouane.app",pw0=n=>n.toLowerCase().replace(/\s+/g,"");
const rnd=()=>{const c="abcdefghjkmnpqrstuvwxyzABCDEFGHJKMNPQRSTUVWXYZ23456789";return[...crypto.getRandomValues(new Uint32Array(12))].map(x=>c[x%c.length]).join("")};
const done=n=>!!n&&F.every(f=>nm(n[f[0]]));
const dt=(n,d)=>F.filter(f=>f[1]==d).reduce((a,f)=>a+((n&&n[f[0]])||0),0);
const tot=n=>Object.keys(D).reduce((a,d)=>a+dt(n,d),0),sc20=n=>tot(n)/28;
const rate=L=>{const d=L.filter(x=>done(x.n));return d.length?d.filter(x=>sc20(x.n)>5).length*100/d.length:null};
const sp=(s,g)=>rate(s.st.filter(x=>!g||x.sexe==g)),good=(s,g)=>{const p=sp(s,g);return p!=null&&p>50};
const grp=(L,g)=>{if(!L.some(s=>s.st.some(x=>done(x.n)&&(!g||x.sexe==g))))return null;const Z=g?L.filter(s=>s.st.some(x=>x.sexe==g)):L;return Z.filter(s=>good(s,g)).length*100/Z.length};
async function all(q){let o=[],f=0;for(;;){const{data,error}=await q().range(f,f+999);if(error)throw error;o=o.concat(data);if(data.length<1000)break;f+=1000}return o}
let ME,P,E,ST,AD,SCH;

/* ---------- Connexion / inscription ---------- */
function showLogin(m=""){app(`<div class="box"><h1>Suivi des notes CM2</h1><span class="mu">IEF de Tivaouane</span><input id="lg" placeholder="Identifiant (nom du directeur)"><input id="pw" type="password" placeholder="Mot de passe"><button class="on" onclick="login()">Connexion</button><div id="m">${m}</div><a href="#" onclick="showReg();return false">Inscrire mon école</a></div>`)}
async function login(){const{error}=await sb.auth.signInWithPassword({email:mail($("#lg").value),password:$("#pw").value});if(error)return $("#m").innerHTML=msg("Identifiant ou mot de passe incorrect.");boot()}
async function out(){await sb.auth.signOut();showLogin()}
async function showReg(){const{data:C}=await sb.from("codecs").select("*").order("nom");app(`<div class="box"><h1>Inscription d’une école</h1><input id="en" placeholder="Nom de l’école"><input id="dn" placeholder="Nom du directeur"><select id="cd"><option value="">Choisir le CODEC…</option>${(C||[]).map(c=>`<option value="${c.id}">${esc(c.nom)}</option>`).join("")}</select><input id="ic" placeholder="Code d’invitation"><button class="on" onclick="reg()">S’inscrire</button><div id="m"></div><a href="#" onclick="showLogin();return false">Retour à la connexion</a></div>`)}
async function reg(){const en=$("#en").value.trim(),dn=$("#dn").value.trim(),cd=$("#cd").value,ic=$("#ic").value.trim(),pw=pw0(en),er=t=>{$("#m").innerHTML=msg(t)};
if(!en||!dn||!cd||!ic)return er("Remplissez tous les champs.");if(pw.length<6)return er("Le nom de l’école est trop court.");
for(const lg of[dn,dn+" "+en]){const e=mail(lg);let r=await sb.auth.signUp({email:e,password:pw});if(r.error||!r.data.session)r=await sb.auth.signInWithPassword({email:e,password:pw});if(r.error||!r.data.session)continue;
const{error}=await sb.rpc("inscrire_ecole",{p_nom:en,p_directeur:dn,p_codec:cd,p_code:ic});if(error){await sb.auth.signOut();return er(esc(error.message))}return boot()}
er("Inscription impossible : identifiant déjà utilisé ou « Confirm email » encore activé dans Supabase.")}
async function boot(){const{data:{session}}=await sb.auth.getSession();if(!session)return showLogin();ME=session.user;
const{data:p}=await sb.from("profiles").select("*").eq("id",ME.id).maybeSingle();P=p;
if(!p)return app(`<div class="box">${msg("Ce compte n’est rattaché à aucun profil.")}<button onclick="out()">Déconnexion</button></div>`);
if(p.role=="ecole"){const{data:e}=await sb.from("ecoles").select("*,codecs(nom)").eq("user_id",ME.id).maybeSingle();E=e;if(p.must_change)return showChange();
if(e.statut!="valide")return app(`<div class="box"><h1>${esc(e.nom)}</h1><p>${e.statut=="suspendu"?"Votre compte est suspendu. Contactez l’administrateur.":"Votre inscription est en attente de validation par l’administrateur. Revenez plus tard."}</p><button onclick="out()">Déconnexion</button></div>`);return startSchool()}
if(p.must_change)return showChange();startAdmin()}
function showChange(){const id=E?(slug(E.directeur)==P.login?E.directeur:E.directeur+" "+E.nom):"";app(`<div class="box"><h1>Nouveau mot de passe</h1><p>Choisissez votre mot de passe personnel (6 caractères minimum).</p>${E?`<p class="mu">Pour vous reconnecter, votre identifiant est : <b>${esc(id)}</b></p>`:""}<input id="n1" type="password" placeholder="Nouveau mot de passe"><input id="n2" type="password" placeholder="Confirmer"><button class="on" onclick="chg()">Enregistrer</button><div id="m"></div></div>`)}
async function chg(){const a=$("#n1").value;if(a.length<6||a!=$("#n2").value)return $("#m").innerHTML=msg("Mots de passe différents ou trop courts.");
const{error}=await sb.auth.updateUser({password:a});if(error)return $("#m").innerHTML=msg(esc(error.message));const r=await sb.rpc("mdp_change");if(r.error)return $("#m").innerHTML=msg(esc(r.error.message));boot()}

/* ---------- Vue École ---------- */
function startSchool(){ST={mo:new Date().toISOString().slice(0,7),nu:1,el:[],N:{}};
app(`<div class="top"><div><h1>${esc(E.nom)}</h1><span class="mu">${esc(E.codecs?.nom||"CODEC non défini")} · Directeur : ${esc(E.directeur)}</span></div><button onclick="out()">Déconnexion</button></div>
<div class="bar"><input type="month" id="mo" value="${ST.mo}"><select id="nu">${[1,2,3,4].map(n=>`<option value="${n}">Saisie ${n}</option>`).join("")}</select></div>
<div class="bar"><input id="fp" placeholder="Prénom"><input id="fn" placeholder="Nom"><select id="fs"><option>G</option><option>F</option></select><button onclick="addEl()">Ajouter l’élève</button></div>
<div class="w"><table id="tb"></table></div><span id="sv" class="mu"></span><h3>Pourcentage de réussite</h3><div class="cards" id="sp"></div>`);
$("#mo").onchange=e=>{ST.mo=e.target.value||ST.mo;loadSchool()};$("#nu").onchange=e=>{ST.nu=+e.target.value;loadSchool()};
const t=$("#tb");t.oninput=inp;t.onchange=chgd;t.onfocusout=e=>{if(!e.relatedTarget||!t.contains(e.relatedTarget))setTimeout(drawSchool,0)};loadSchool()}
async function loadSchool(){const{data:el,error}=await sb.from("eleves").select("*").eq("ecole_id",E.id).order("nom").order("prenom");if(error)return alert(error.message);ST.el=el||[];ST.N={};
const{data:n}=await sb.from("notes").select("*").eq("mois",ST.mo).eq("numero",ST.nu);(n||[]).forEach(r=>ST.N[r.eleve_id]=r);drawSchool()}
function ordered(){const st=ST.el.map(e=>({...e,n:ST.N[e.id]})),al=(x,y)=>(x.nom+" "+x.prenom).localeCompare(y.nom+" "+y.prenom,"fr"),all=st.length>0&&st.every(s=>done(s.n));
st.sort(all?(x,y)=>sc20(y.n)-sc20(x.n)||al(x,y):al);return{st,all}}
function drawSchool(){const{st,all}=ordered(),rk=s=>all?1+st.filter(o=>sc20(o.n)>sc20(s.n)).length:"–";
let h=`<tr><th>Rang</th><th>Élève</th><th>Sexe</th>`+F.map((f,i)=>`<th>${f[1]}<br>${f[2]}<br>/${f[3]}</th>`+(last(i)?`<th class="tg">Total ${f[1]}<br>/${D[f[1]][1]}</th>`:"")).join("")+`<th>Total /280</th><th>Moy. /10</th><th></th></tr>`;
st.forEach(s=>{const n=s.n||{};h+=`<tr data-id="${s.id}"><td>${rk(s)}</td><td>${esc(s.nom)} ${esc(s.prenom)}</td><td>${s.sexe}</td>`+F.map((f,i)=>`<td><input type="number" inputmode="decimal" min="0" max="${f[3]}" step="0.25" data-s="${s.id}" data-k="${f[0]}" data-m="${f[3]}" value="${nm(n[f[0]])?n[f[0]]:""}"></td>`+(last(i)?`<td class="tg" id="G${s.id}${f[1]}">${f1(dt(n,f[1]))}</td>`:"")).join("")+`<td id="T${s.id}">${f1(tot(n))}</td><td id="V${s.id}">${done(n)?f1(sc20(n)):"–"}</td><td><button onclick="delEl('${s.id}')">✕</button></td></tr>`});
$("#tb").innerHTML=h;foot()}
function live(id){const n=ST.N[id]||{};Object.keys(D).forEach(d=>{const g=$("#G"+id+d);if(g)g.textContent=f1(dt(n,d))});$("#T"+id).textContent=f1(tot(n));$("#V"+id).textContent=done(n)?f1(sc20(n)):"–"}
function foot(){const st=ST.el.map(e=>({...e,n:ST.N[e.id]})),c=(g,l)=>{const d=st.filter(s=>done(s.n)&&(!g||s.sexe==g));return`<div class="c"><span class="mu">${l}</span><b>${pc(rate(d))}</b><span class="mu">${d.filter(s=>sc20(s.n)>5).length}/${d.length} élèves à plus de 50 %</span></div>`};$("#sp").innerHTML=c("","Total G/F")+c("G","Garçons")+c("F","Filles")}
function inp(e){const i=e.target;if(!i.dataset.s)return;let v=i.value===""?null:parseFloat(i.value.replace(",","."));const mx=+i.dataset.m;
if(v!=null&&(isNaN(v)||v<0)){v=0;i.value=0}if(v>mx){v=mx;i.value=mx}ST.N[i.dataset.s]={...(ST.N[i.dataset.s]||{}),[i.dataset.k]:v};live(i.dataset.s);foot()}
async function chgd(e){const i=e.target,id=i.dataset.s;if(!id)return;const k=i.dataset.k,v=ST.N[id]?ST.N[id][k]:null;
const{error}=await sb.from("notes").upsert({eleve_id:id,mois:ST.mo,numero:ST.nu,[k]:v===undefined?null:v},{onConflict:"eleve_id,mois,numero"});
if(error)return alert("Échec de l’enregistrement : "+error.message);$("#sv").textContent="Enregistré ✓";
const o=ordered();if(o.all&&[...document.querySelectorAll("#tb tr[data-id]")].map(r=>r.dataset.id).join()!=o.st.map(s=>s.id).join())setTimeout(drawSchool,0)}
async function addEl(){const prenom=$("#fp").value.trim(),nom=$("#fn").value.trim();if(!prenom||!nom)return;const{error}=await sb.from("eleves").insert({ecole_id:E.id,prenom,nom,sexe:$("#fs").value});if(error)return alert(error.message);loadSchool()}
async function delEl(id){if(!confirm("Supprimer cet élève et toutes ses notes ?"))return;const{error}=await sb.from("eleves").delete().eq("id",id);if(error)return alert(error.message);loadSchool()}

/* ---------- Administrateurs ---------- */
function startAdmin(){const pr=P.role=="principal";AD={tab:"res",mo:new Date().toISOString().slice(0,7),nu:1};
app(`<div class="top"><div><h1>Suivi des notes CM2 – IEF</h1><span class="mu">${pr?"Administrateur principal":"Administrateur (lecture seule)"}</span></div><button onclick="out()">Déconnexion</button></div>
<div class="bar"><button id="b_res" class="on" onclick="tab('res')">Résultats</button>${pr?`<button id="b_ec" onclick="tab('ec')">Gestion des écoles</button><button id="b_ad" onclick="tab('ad')">Gestion des administrateurs</button>`:""}</div>
<div class="bar" id="per"><input type="month" id="amo" value="${AD.mo}"><select id="anu">${[1,2,3,4].map(n=>`<option value="${n}">Saisie ${n}</option>`).join("")}</select></div><div id="ct">Chargement…</div>`);
$("#amo").onchange=e=>{AD.mo=e.target.value||AD.mo;loadRes()};$("#anu").onchange=e=>{AD.nu=+e.target.value;loadRes()};loadRes()}
function tab(t){AD.tab=t;["res","ec","ad"].forEach(x=>{const b=$("#b_"+x);if(b)b.classList.toggle("on",x==t)});$("#per").classList.toggle("hide",t!="res");t=="res"?loadRes():t=="ec"?drawEc():drawAd()}
async function loadRes(){$("#ct").textContent="Chargement…";try{
const[ec,el,cd,nt]=await Promise.all([all(()=>sb.from("ecoles").select("id,nom,directeur,codec_id,statut").order("id")),all(()=>sb.from("eleves").select("id,ecole_id,prenom,nom,sexe").order("id")),all(()=>sb.from("codecs").select("*").order("id")),all(()=>sb.from("notes").select("*").eq("mois",AD.mo).eq("numero",AD.nu).order("eleve_id"))]);
const cn={};cd.forEach(c=>cn[c.id]=c.nom);const NM={};nt.forEach(r=>NM[r.eleve_id]=r);const by={};el.forEach(s=>(by[s.ecole_id]=by[s.ecole_id]||[]).push({...s,n:NM[s.id]}));
SCH=ec.filter(e=>e.statut=="valide").map(e=>({...e,codec:cn[e.codec_id]||"Sans CODEC",st:by[e.id]||[]}));drawRes()}catch(e){$("#ct").innerHTML=msg(esc(e.message))}}
function schHtml(s,i){const ds=s.st.filter(x=>done(x.n)),low=ds.filter(x=>sc20(x.n)<5),al=[];
Object.keys(D).forEach(d=>{if(ds.length){const v=avg(ds.map(x=>dt(x.n,d)/D[d][1]*100));if(v<50)al.push(`${D[d][0]} : score de ${Math.round(v)} % (sous 50 %). Piste : ${SOL[d]}`)}});
if(low.length)al.push(`${low.length} élève(s) sous 5/10 : ${low.map(x=>esc(x.prenom+" "+x.nom)).join(", ")}. Piste : soutien individualisé et suivi hebdomadaire.`);
const rk=[...ds].sort((a,b)=>sc20(b.n)-sc20(a.n));
return`<details><summary><span><b>${sp(s,"")==null?"":(i+1)+"."} ${esc(s.nom)}</b> · ${ds.length}/${s.st.length} élèves</span><span><b>${pc(sp(s,""))}</b> (G ${pc(sp(s,"G"))} · F ${pc(sp(s,"F"))}) · <span class="${al.length?"ko":"ok"}">${al.length} alerte(s)</span></span></summary>
<div class="mu">Directeur : ${esc(s.directeur)}</div><ul>${al.length?al.map(a=>`<li>${a}</li>`).join(""):"<li class='ok'>Aucune alerte pour cette saisie.</li>"}</ul>
<div class="mu">Classement des élèves :</div><ol>${rk.map(x=>`<li>${esc(x.nom+" "+x.prenom)} (${x.sexe}) — ${f1(sc20(x.n))}/10</li>`).join("")}</ol></details>`}
function drawRes(){const L=SCH,A=L.flatMap(s=>s.st).filter(x=>done(x.n)),G={};L.forEach(s=>(G[s.codec]=G[s.codec]||[]).push(s));
const C=Object.keys(G).map(k=>({k,sc:G[k],n:G[k].filter(s=>good(s,"")).length,p:grp(G[k],""),pg:grp(G[k],"G"),pf:grp(G[k],"F")})).sort((a,b)=>(b.p??-1)-(a.p??-1));
$("#ct").innerHTML=`<div class="cards">${[["% IEF total G/F",pc(grp(L,""))],["% IEF garçons",pc(grp(L,"G"))],["% IEF filles",pc(grp(L,"F"))],["Écoles validées",L.length],["Élèves saisis",A.length],["Élèves sous 5/10",A.filter(x=>sc20(x.n)<5).length]].map(c=>`<div class="c"><span class="mu">${c[0]}</span><b>${c[1]}</b></div>`).join("")}</div>
<h3>Classement des CODEC</h3><div class="w"><table><tr><th>Rang</th><th>CODEC</th><th>Écoles</th><th>Écoles à plus de 50 %</th><th>% total G/F</th><th>% garçons</th><th>% filles</th></tr>${C.map((c,i)=>`<tr><td>${c.p==null?"–":i+1}</td><td>${esc(c.k)}</td><td>${c.sc.length}</td><td>${c.n}</td><td><b>${pc(c.p)}</b></td><td>${pc(c.pg)}</td><td>${pc(c.pf)}</td></tr>`).join("")}</table></div>
<h3>Écoles par CODEC</h3>${C.map(c=>`<details><summary><span><b>${esc(c.k)}</b> · ${c.sc.length} école(s)</span><b>${pc(c.p)}</b></summary>${[...c.sc].sort((a,b)=>(sp(b,"")??-1)-(sp(a,"")??-1)).map(schHtml).join("")}</details>`).join("")||"<p class='mu'>Aucune école validée pour le moment.</p>"}`}

/* ---------- Gestion des écoles (principal) ---------- */
async function drawEc(){$("#ct").textContent="Chargement…";try{
const[ec,cd,pm]=await Promise.all([all(()=>sb.from("ecoles").select("*").order("nom").order("id")),all(()=>sb.from("codecs").select("*").order("nom")),sb.from("parametres").select("*").eq("cle","code_invitation").maybeSingle()]);
ECL={};ec.forEach(e=>ECL[e.user_id]=e);ec.sort((a,b)=>(a.statut=="en_attente"?0:1)-(b.statut=="en_attente"?0:1));const opt=(L,v)=>L.map(x=>`<option value="${x[0]}" ${x[0]==v?"selected":""}>${esc(x[1])}</option>`).join("");
$("#ct").innerHTML=`<h3>Code d’invitation</h3><div class="bar"><input id="ci" value="${esc(pm.data?pm.data.valeur:"")}"><button onclick="setCode()">Enregistrer</button></div>
<h3>CODEC</h3><div class="bar"><input id="nc" placeholder="Nom du nouveau CODEC"><button onclick="addCd()">Ajouter</button></div>
${cd.map(c=>`<div class="bar"><input value="${esc(c.nom)}" onchange="renCd('${c.id}',this.value)"><button onclick="delCd('${c.id}')">Supprimer</button></div>`).join("")}
<h3>Écoles (${ec.length})</h3><div class="w"><table><tr><th>École</th><th>Directeur</th><th>CODEC</th><th>Statut</th><th>Actions</th></tr>${ec.map(e=>`<tr><td style="text-align:left">${esc(e.nom)}</td><td>${esc(e.directeur)}</td>
<td><select onchange="upEc('${e.id}',{codec_id:this.value||null})"><option value="">–</option>${opt(cd.map(c=>[c.id,c.nom]),e.codec_id)}</select></td>
<td><select onchange="upEc('${e.id}',{statut:this.value})">${opt([["en_attente","En attente"],["valide","Validée"],["suspendu","Suspendue"]],e.statut)}</select></td>
<td><button onclick="rstEc('${e.user_id}')">Réinitialiser mot de passe</button> <button onclick="delEc('${e.user_id}')">Supprimer</button></td></tr>`).join("")}</table></div>`}catch(e){$("#ct").innerHTML=msg(esc(e.message))}}
const chk=async(p,ok)=>{const{error}=await p;if(error)alert(error.message);else if(ok)ok()};
const setCode=()=>chk(sb.from("parametres").update({valeur:$("#ci").value.trim()}).eq("cle","code_invitation"),()=>alert("Code d’invitation enregistré."));
const addCd=()=>{const n=$("#nc").value.trim().toUpperCase();if(n)chk(sb.from("codecs").insert({nom:n}),drawEc)};
const renCd=(id,v)=>chk(sb.from("codecs").update({nom:v.trim().toUpperCase()}).eq("id",id),drawEc);
const delCd=id=>{if(confirm("Supprimer ce CODEC ? Les écoles concernées n’auront plus de CODEC."))chk(sb.from("codecs").delete().eq("id",id),drawEc)};
const upEc=(id,o)=>chk(sb.from("ecoles").update(o).eq("id",id));
let ECL={};
const rstEc=u=>{if(confirm("Réinitialiser le mot de passe de cette école au nom de l’école en minuscules, sans espaces ?"))chk(sb.rpc("changer_mdp_utilisateur",{p_user:u,p_mdp:pw0(ECL[u].nom)}),()=>alert("Mot de passe réinitialisé. L’école devra en choisir un nouveau à sa prochaine connexion."))};
const delEc=u=>{if(confirm("Supprimer définitivement cette école, ses élèves et ses notes ?"))chk(sb.rpc("supprimer_utilisateur",{p_user:u}),drawEc)};

/* ---------- Gestion des administrateurs (principal) ---------- */
async function drawAd(){$("#ct").textContent="Chargement…";const{data,error}=await sb.from("admin_passwords").select("*").order("login");if(error)return $("#ct").innerHTML=msg(esc(error.message));
$("#ct").innerHTML=`<h3>Nouvel administrateur (lecture seule)</h3><div class="bar"><input id="an" placeholder="Nom ou identifiant"><button class="on" onclick="addAdm()">Créer</button></div><p class="mu">L’appli génère le mot de passe. L’administrateur ne peut pas le changer.</p>
<div class="w"><table><tr><th>Identifiant</th><th>Mot de passe</th><th>Actions</th></tr>${data.map(a=>`<tr><td>${esc(a.login)}</td><td><code>${esc(a.mot_de_passe)}</code></td><td><button onclick="regAdm('${a.user_id}')">Régénérer</button> <button onclick="delAdm('${a.user_id}')">Supprimer</button></td></tr>`).join("")||"<tr><td colspan=3>Aucun administrateur secondaire.</td></tr>"}</table></div>`}
async function addAdm(){const lg=$("#an").value.trim();if(!lg)return;const pw=rnd(),s2=supabase.createClient(U,K,{auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false}});
const r=await s2.auth.signUp({email:mail(lg),password:pw});if(r.error||!r.data.user)return alert(r.error?r.error.message:"Création impossible (identifiant déjà utilisé ?)");
chk(sb.rpc("creer_admin",{p_user:r.data.user.id,p_login:lg,p_mdp:pw}),drawAd)}
const regAdm=u=>chk(sb.rpc("changer_mdp_utilisateur",{p_user:u,p_mdp:rnd()}),drawAd);
const delAdm=u=>{if(confirm("Supprimer cet administrateur ?"))chk(sb.rpc("supprimer_utilisateur",{p_user:u}),drawAd)};

sb.auth.onAuthStateChange(()=>{});boot();
</script></body></html>
